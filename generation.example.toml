schema_version = "0.1"

[provider]
kind = "openai_compatible"
base_url = "http://127.0.0.1:8000/v1"
model = "replace-with-the-model-served-locally"
timeout_seconds = 180
# É um teto, não um tamanho obrigatório: respostas simples podem terminar antes.
max_output_tokens = 2048
temperature = 0.1
# Limite de evidência textual enviado ao modelo; ajuste à janela do servidor.
max_context_characters = 8000
# Audita cada afirmação contra as fontes citadas e permite uma única correção.
verify_evidence = true
verification_max_tokens = 768
# Repete somente a auditoria estruturada quando o provedor devolve saída inválida.
verification_max_attempts = 2
max_repair_attempts = 1
