schema_version = "0.1"

[defaults]
branch_scope = "remote"
access_class = "lab"
profile = "generic"
cache_root = "cache/repositories"
inventory_root = "inventory/repositories"
normalized_root = "data/repositories"
inventory_policy_file = "inventory-policies.toml"
fetch_timeout_seconds = 3600

[[repositories]]
id = "mfsim-ng"
enabled = true
project = "MFSim-NG"
aliases = ["ng", "mfsim ng"]
remote_url = "https://www.mflab.mecanica.ufu.br/gitlab/mfsim/mfsim-ng.git"
canonical_ref = "remote_default"
preferred_branch = "base"
branch_scope = "remote"
access_class = "lab"
profile = "mfsim-ng-pilot"
# Filtros são opcionais e usam glob. A branch canônica sempre é preservada.
# include_branches = ["master", "develop", "feature/*"]
# exclude_branches = ["archive/*"]

[[repositories]]
id = "mfsim-cmake"
enabled = true
project = "MFSim CMake"
aliases = ["cmake", "mfsim-cmake"]
remote_url = "https://www.mflab.mecanica.ufu.br/gitlab/mfsim/mfsim-cmake.git"
canonical_ref = "remote_default"
# Sem preferred_branch, a recuperação usa a branch canônica.
branch_scope = "remote"
access_class = "lab"
profile = "generic"

# Exemplo de fonte ainda não autorizada. Ative somente após confirmar a política.
[[repositories]]
id = "mfgui"
enabled = false
project = "MFGUI"
source = "/caminho/a-confirmar/mfgui"
canonical_ref = "origin/<confirmar>"
branch_scope = "remote"
access_class = "pending"
profile = "generic"
