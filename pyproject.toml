[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mflab-knowledge-rag"
version = "0.43.1"
description = "Inventário, indexação e RAG interno para fontes autorizadas do MFLab"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
embeddings = [
    "pgvector>=0.4,<1",
    "sentence-transformers>=5,<6",
]
service = [
    "fastapi>=0.115,<1",
    "pydantic>=2.7,<3",
    "uvicorn>=0.30,<1",
]

[project.scripts]
mflab-knowledge = "mflab_knowledge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mflab_knowledge = ["sql/*.sql", "web/*"]

[tool.unittest]
start-directory = "tests"
